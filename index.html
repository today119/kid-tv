<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>우리튜브</title>
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f0f0f" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="우리튜브">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#fff;--fg:#0f0f0f;--sub:#606060;--line:#e5e5e5;--chip:#f2f2f2;--chipon:#0f0f0f;--chipont:#fff;--red:#ff0033;--card:#fff;--sheet:#fff;--hover:#f2f2f2;--sat:env(safe-area-inset-top);--sab:env(safe-area-inset-bottom)}
@media (prefers-color-scheme:dark){:root{--bg:#0f0f0f;--fg:#f1f1f1;--sub:#aaa;--line:#3f3f3f;--chip:#272727;--chipon:#f1f1f1;--chipont:#0f0f0f;--card:#0f0f0f;--sheet:#212121;--hover:#272727}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:Roboto,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",Arial,sans-serif;-webkit-text-size-adjust:100%;overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select{font:inherit;color:var(--fg)}
img{display:block}
.hide{display:none!important}
/* 위 막대 */
.top{position:sticky;top:0;z-index:20;background:var(--bg);padding-top:var(--sat)}
.tb{height:48px;display:flex;align-items:center;padding:0 8px 0 12px;gap:4px}
.logo{display:flex;align-items:center;gap:3px;font-weight:700;letter-spacing:-1.2px;font-size:19px}
.logo svg{width:30px;height:21px}
.tb .sp{flex:1}
.ib{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;position:relative}
.ib svg{width:24px;height:24px}
.ib:active{background:var(--hover)}
.dot{position:absolute;top:6px;right:5px;background:var(--red);color:#fff;font-size:10px;font-weight:700;min-width:16px;height:16px;border-radius:8px;display:grid;place-items:center;padding:0 3px;border:2px solid var(--bg)}
.av{border-radius:50%;object-fit:cover;background:var(--chip);flex:none}
.pav{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:14px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 12px 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;background:var(--chip);border-radius:8px;padding:6px 12px;font-size:14px;font-weight:500;white-space:nowrap}
.chip.on{background:var(--chipon);color:var(--chipont)}
/* 목록 */
main{padding-bottom:calc(60px + var(--sab))}
.feed{display:grid;grid-template-columns:1fr;gap:0 16px}
@media (min-width:600px){.feed{grid-template-columns:1fr 1fr;padding:0 16px}.vc .th{border-radius:12px}}
@media (min-width:1000px){.feed{grid-template-columns:1fr 1fr 1fr}}
.vc{margin-bottom:18px;cursor:pointer}
.th{position:relative;aspect-ratio:16/9;background:var(--chip);overflow:hidden}
.th img{width:100%;height:100%;object-fit:cover}
.dur{position:absolute;right:8px;bottom:8px;background:#000c;color:#fff;font-size:12px;font-weight:500;padding:1px 4px;border-radius:4px}
.meta{display:flex;gap:12px;padding:12px 12px 0}
.meta .av{width:36px;height:36px}
.meta .tx{min-width:0;flex:1}
.ti{font-size:15px;line-height:1.35;font-weight:500;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sb{font-size:12.5px;color:var(--sub);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sec{display:flex;align-items:center;gap:8px;font-size:18px;font-weight:700;padding:12px 12px 10px}
.sec svg{width:24px;height:24px}
.shrow{display:flex;gap:8px;overflow-x:auto;padding:0 12px 18px;scrollbar-width:none}
.shrow::-webkit-scrollbar{display:none}
.sc{flex:none;width:42vw;max-width:200px;cursor:pointer}
.sc .st{aspect-ratio:9/16;border-radius:10px;overflow:hidden;background:var(--chip);position:relative}
.sc .st img{width:100%;height:100%;object-fit:cover}
.sc .ti{font-size:14px;margin-top:6px}
.sc .sb{margin-top:2px}
.more{height:40px}
.empty{text-align:center;color:var(--sub);padding:60px 20px;font-size:15px;line-height:1.6}
/* 아래 막대 */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bg);border-top:1px solid var(--line);display:flex;padding-bottom:var(--sab)}
.nav button{flex:1;height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px}
.nav svg{width:24px;height:24px}
/* 재생 화면 */
.watch{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;transform:translateY(100%);transition:transform .25s ease;padding-top:var(--sat)}
.watch.on{transform:none}
.wbody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
@media (min-width:1000px){.watch.on .wwrap{display:flex;gap:24px;padding:16px 24px;align-items:flex-start}.wl{flex:1;min-width:0}.wl .pbox{border-radius:12px;overflow:hidden}.wr{width:400px;flex:none}}
.pbox{position:relative;background:#000;aspect-ratio:16/9;width:100%;overflow:hidden}
.pbox .yt,.pbox iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.pbox.lock iframe{pointer-events:none}
.blk{position:absolute;left:0;right:0;z-index:3}
.blk.t{top:0;height:22%}.blk.b{bottom:0;height:18%}
.ov{position:absolute;inset:0;z-index:4;display:none}
.pbox.lock .ov{display:block}
.pbox:not(.lock) .ctl,.pbox:not(.lock) .poster{display:none!important}
.pbox.ad iframe{pointer-events:auto}.pbox.ad .ov,.pbox.ad .ctl,.pbox.ad .poster{display:none!important}
.poster{position:absolute;inset:0;z-index:5;background:#000 center/cover no-repeat;display:none}
.pbox.paused .poster,.pbox.ended .poster{display:block}
.ctl{position:absolute;inset:0;z-index:6;background:#0006;opacity:0;transition:opacity .2s;pointer-events:none;display:flex;align-items:center;justify-content:center;gap:12%}
.pbox.showc .ctl,.pbox.paused .ctl{opacity:1;pointer-events:auto}
.cb{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;color:#fff}
.cb.big{width:68px;height:68px;background:#0005}
.cb svg{width:60%;height:60%;fill:#fff}
.bar{position:absolute;left:0;right:0;bottom:0;padding:0 12px 10px;color:#fff;font-size:12px}
.bar .r{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.bar .r .sp{flex:1}
.seek{position:relative;height:16px;display:flex;align-items:center;touch-action:none}
.seek .tr{position:absolute;left:0;right:0;height:3px;background:#fff5;border-radius:2px}
.seek .pl{position:absolute;left:0;height:3px;background:var(--red);border-radius:2px}
.seek .kn{position:absolute;width:13px;height:13px;margin-left:-6px;border-radius:50%;background:var(--red)}
.fsb{width:32px;height:32px;display:grid;place-items:center}.fsb svg{width:24px;height:24px;fill:#fff}
.spin{position:absolute;inset:0;z-index:5;display:grid;place-items:center;pointer-events:none}
.spin i{width:44px;height:44px;border:4px solid #fff3;border-top-color:#fff;border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.endc{position:absolute;inset:0;z-index:7;background:#000d;color:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:12px;text-align:center}
.pbox.ended .endc{display:flex}
.endc .nx{display:flex;gap:10px;align-items:center;max-width:420px;text-align:left}
.endc .nx img{width:42%;aspect-ratio:16/9;object-fit:cover;border-radius:8px;flex:none}
.endc .nx .ti{font-size:14px}
.endc .eb{display:flex;gap:10px}
.endc .eb button{background:#fff2;border-radius:18px;padding:7px 16px;font-size:14px;font-weight:500}
.endc .eb button.p{background:#fff;color:#000}
.ring{font-size:13px;opacity:.85}
.pbox.fs{position:fixed;inset:0;z-index:60;aspect-ratio:auto;height:100%;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.wtop{display:flex;align-items:center;height:0}
.wclose{position:absolute;z-index:8;top:calc(6px + var(--sat));left:6px;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;opacity:0;transition:opacity .2s}
.wclose svg{width:28px;height:28px;fill:#fff}
.pbox.showc~.wclose,.pbox.paused~.wclose,.watch .wclose.on{opacity:1}
.winfo{padding:12px}
.winfo h1{font-size:18px;line-height:1.35;margin:0 0 6px;font-weight:700}
.winfo .vw{font-size:12.5px;color:var(--sub)}
.chrow{display:flex;align-items:center;gap:10px;padding:10px 12px}
.chrow .av{width:40px;height:40px}
.chrow b{font-size:15px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chrow .sp{flex:1;min-width:0}
.subd{background:var(--chip);border-radius:18px;padding:8px 14px;font-size:14px;font-weight:500;display:flex;align-items:center;gap:4px}
.subd svg{width:20px;height:20px}
.acts{display:flex;gap:8px;padding:0 12px 12px;overflow-x:auto}
.pill{background:var(--chip);border-radius:18px;height:36px;padding:0 14px;display:flex;align-items:center;gap:6px;font-size:14px;font-weight:500;flex:none}
.pill svg{width:22px;height:22px}
.pill.on svg{fill:var(--fg)}
.pill.warn{color:#e03131}
.upn{padding-top:4px}
.ri{display:flex;gap:8px;padding:0 12px 12px;cursor:pointer}
.ri .th{width:44%;max-width:180px;flex:none;border-radius:8px}
.ri .ti{font-size:14px}
.ri .sb{white-space:normal}
@media (max-width:999px){.wr .ri{display:block;padding:0}.wr .ri .th{width:100%;max-width:none;border-radius:0}.wr .ri .tx{padding:10px 12px 18px}}
/* 쇼츠 */
.shorts{position:fixed;inset:0;z-index:30;background:#000;display:none}
.shorts.on{display:block}
.shorts .pbox{position:absolute;inset:0;aspect-ratio:auto;height:100%}
.shorts .sinfo{position:absolute;left:12px;right:70px;bottom:calc(70px + var(--sab));z-index:8;color:#fff;text-shadow:0 1px 3px #000a}
.shorts .sinfo .c{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;margin-bottom:8px}
.shorts .sinfo .c img{width:32px;height:32px}
.shorts .sinfo .t{font-size:14px;line-height:1.35}
.shorts .sside{position:absolute;right:8px;bottom:calc(80px + var(--sab));z-index:8;display:flex;flex-direction:column;gap:18px;color:#fff;align-items:center;font-size:12px}
.shorts .sside button{display:flex;flex-direction:column;align-items:center;gap:4px}
.shorts .sside .o{width:48px;height:48px;border-radius:50%;background:#fff2;display:grid;place-items:center}
.shorts .sside svg{width:26px;height:26px;fill:#fff}
.shorts .sside .on svg{fill:#fff}
.shorts .stop{position:absolute;top:calc(8px + var(--sat));left:8px;right:8px;z-index:8;display:flex;justify-content:space-between}
.shorts .stop button{width:40px;height:40px;display:grid;place-items:center}
.shorts .stop svg{width:28px;height:28px;fill:#fff}
.shorts .pbox .ctl{background:transparent}
.shorts .pbox.paused .ctl{background:#0004}
.shorts .pbox .poster{background-size:contain}
.swipe{position:absolute;inset:0;z-index:7}
/* 시트 */
.dim{position:fixed;inset:0;z-index:70;background:#0008;display:none;align-items:flex-end;justify-content:center}
.dim.on{display:flex}
.sheet{background:var(--sheet);width:100%;max-width:560px;border-radius:12px 12px 0 0;max-height:88vh;overflow-y:auto;padding:8px 0 calc(12px + var(--sab))}
.sheet .gr{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 10px}
.sheet h3{margin:4px 16px 12px;font-size:17px}
.mi{display:flex;align-items:center;gap:14px;padding:12px 16px;width:100%;text-align:left;font-size:15px}
.mi:active{background:var(--hover)}
.mi svg{width:24px;height:24px;flex:none}
.mi .x{margin-left:auto;color:var(--sub);font-size:13px}
.mi .pav{width:36px;height:36px;font-size:16px}
.who{position:fixed;inset:0;z-index:80;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:20px}
.who h2{margin:0;font-size:22px}
.who .ps{display:flex;gap:28px;flex-wrap:wrap;justify-content:center}
.who .ps button{display:flex;flex-direction:column;align-items:center;gap:10px;font-size:16px;font-weight:600}
.who .ps .pav{width:96px;height:96px;font-size:40px}
/* 부모 설정 */
.adm{position:fixed;inset:0;z-index:75;background:var(--bg);overflow-y:auto;padding:calc(8px + var(--sat)) 0 calc(30px + var(--sab));display:none}
.adm.on{display:block}
.adm .hd{display:flex;align-items:center;gap:8px;padding:0 8px 8px;position:sticky;top:0;background:var(--bg);z-index:2}
.adm .hd b{font-size:19px;flex:1}
.box{margin:0 12px 16px;border:1px solid var(--line);border-radius:12px;padding:14px}
.box h4{margin:0 0 10px;font-size:16px}
.note{font-size:13px;color:var(--sub);line-height:1.5}
.crow{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.crow:first-of-type{border-top:0}
.crow .av{width:40px;height:40px}
.crow .tx{flex:1;min-width:0}
.crow b{display:block;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sbtn{background:var(--chip);border-radius:18px;padding:7px 14px;font-size:13.5px;font-weight:600;flex:none}
.sbtn.p{background:var(--fg);color:var(--bg)}
.sbtn.r{color:#e03131}
.inrow{display:flex;gap:8px}
.inrow input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;font-size:15px}
.tog{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--sub)}
.lim{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.lim button{background:var(--chip);border-radius:8px;padding:6px 10px;font-size:13px}
.lim button.on{background:var(--chipon);color:var(--chipont)}
.pin{display:flex;flex-direction:column;align-items:center;gap:16px;padding:10px 16px 6px}
.pin .ds{display:flex;gap:14px}
.pin .ds i{width:16px;height:16px;border-radius:50%;border:2px solid var(--fg)}
.pin .ds i.f{background:var(--fg)}
.pin .kp{display:grid;grid-template-columns:repeat(3,72px);gap:12px}
.pin .kp button{height:56px;border-radius:28px;background:var(--chip);font-size:22px;font-weight:500}
.pin .msg{min-height:20px;font-size:14px;color:#e03131}
.toast{position:fixed;left:50%;bottom:calc(70px + var(--sab));transform:translateX(-50%);z-index:99;background:#323232;color:#fff;padding:10px 16px;border-radius:8px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.on{opacity:1}
.tlk{position:fixed;inset:0;z-index:84;display:none;touch-action:none;-webkit-user-select:none;user-select:none}.tlk.on{display:block}
.tlk .tb{position:absolute;top:calc(8px + var(--sat));right:10px;width:46px;height:46px;border-radius:50%;background:#0006;color:#fff;font-size:22px;display:grid;place-items:center}
.tlk .tb i{position:absolute;inset:-4px;border-radius:50%;border:4px solid #fff;clip-path:inset(0 100% 0 0);transition:none}.tlk .tb.hold i{clip-path:inset(0 0 0 0);transition:clip-path 3s linear}
.tlk .hn{position:absolute;left:50%;bottom:30%;transform:translateX(-50%);background:#000a;color:#fff;padding:10px 16px;border-radius:20px;font-size:15px;opacity:0;transition:opacity .3s;white-space:nowrap}.tlk .hn.on{opacity:1}
.tlock{position:fixed;inset:0;z-index:85;background:linear-gradient(#1c2541,#3a506b);color:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:24px}
.tlock.on{display:flex}
.tlock .big{font-size:64px}
.tlock h2{margin:0;font-size:24px}
.tlock p{margin:0;font-size:16px;opacity:.85;line-height:1.6}
.tlock button{background:#fff2;border-radius:20px;padding:10px 18px;font-size:14px}
.bell .ri{padding-top:4px}
</style>
</head><body>
<div class="top" id="top">
 <div class="tb">
  <div class="logo"><svg viewBox="0 0 30 21"><rect width="30" height="21" rx="6" fill="#ff0033"/><path d="M12 6v9l8-4.5z" fill="#fff"/></svg><span>우리튜브</span></div>
  <div class="sp"></div>
  <button class="ib" id="bellB" aria-label="알림"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 17V11a6 6 0 1 1 12 0v6l2 2H4z"/><path d="M10 21h4"/></svg><span class="dot hide" id="bellN"></span></button>
  <button class="ib" id="meB" aria-label="프로필"></button>
 </div>
 <div class="chips" id="chips"></div>
</div>
<main id="m"></main>
<nav class="nav" id="nav">
 <button data-t="home"><svg viewBox="0 0 24 24"><path d="M4 10.5 12 4l8 6.5V20h-5v-6H9v6H4z" fill="currentColor"/></svg>홈</button>
 <button data-t="shorts"><svg viewBox="0 0 24 24"><path d="M15.4 2.6c1.7-.9 3.8-.3 4.7 1.4.9 1.7.3 3.8-1.4 4.7l-1.4.8c1.2.1 2.3.8 2.9 1.9.9 1.7.3 3.8-1.4 4.7l-8.2 4.3c-1.7.9-3.8.3-4.7-1.4-.9-1.7-.3-3.8 1.4-4.7l1.4-.8C7 13.4 5.9 12.7 5.3 11.6c-.9-1.7-.3-3.8 1.4-4.7z" fill="currentColor"/><path d="M10 9.2v5.6l4.8-2.8z" fill="var(--bg)"/></svg>Shorts</button>
 <button data-t="subs"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 8h16v12H4z" opacity=".95"/><path d="M6 5h12v1.5H6zM8 2.5h8V4H8z"/><path d="M10 11v6l5-3z" fill="var(--bg)"/></svg>구독</button>
 <button data-t="lib"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="9" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>나</button>
</nav>

<div class="watch" id="watch"><div class="wbody" id="wbody"><div class="wwrap">
 <div class="wl">
  <div class="pbox" id="pbox"><div class="yt" id="yt"></div>
   <div class="blk t"></div><div class="blk b"></div>
   <div class="ov" id="ov"></div>
   <div class="poster" id="poster"></div>
   <div class="spin hide" id="spin"><i></i></div>
   <div class="ctl" id="ctl">
    <button class="cb" id="rw"><svg viewBox="0 0 24 24"><path d="M11 6V2L5 7l6 5V8a6 6 0 1 1-6 6H3a8 8 0 1 0 8-8z"/><text x="12" y="17.5" font-size="6.5" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">10</text></svg></button>
    <button class="cb big" id="pp"></button>
    <button class="cb" id="ff"><svg viewBox="0 0 24 24"><path d="M13 6V2l6 5-6 5V8a6 6 0 1 0 6 6h2a8 8 0 1 1-8-8z"/><text x="12" y="17.5" font-size="6.5" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">10</text></svg></button>
    <div class="bar" id="bar"><div class="r"><span id="tm">0:00 / 0:00</span><span class="sp"></span><button class="fsb" id="fsb"><svg viewBox="0 0 24 24"><path d="M5 5h5v2H7v3H5zm9 0h5v5h-2V7h-3zM5 14h2v3h3v2H5zm12 0h2v5h-5v-2h3z"/></svg></button></div>
     <div class="seek" id="seek"><div class="tr"></div><div class="pl" id="spl"></div><div class="kn" id="skn"></div></div></div>
   </div>
   <div class="endc" id="endc"></div>
  </div>
  <button class="wclose on" id="wclose" aria-label="닫기"><svg viewBox="0 0 24 24"><path d="M7.4 8.6 12 13.2l4.6-4.6L18 10l-6 6-6-6z"/></svg></button>
  <div id="winfo"></div>
 </div>
 <div class="wr" id="wr"></div>
</div></div></div>

<div class="shorts" id="shorts">
 <div class="pbox" id="sbox"><div class="yt" id="syt"></div><div class="blk t"></div><div class="blk b"></div>
  <div class="poster" id="sposter"></div><div class="spin hide" id="sspin"><i></i></div>
  <div class="ctl" id="sctl"><button class="cb big" id="spp"></button></div>
  <div class="swipe" id="swipe"></div></div>
 <div class="stop"><button id="sback"><svg viewBox="0 0 24 24"><path d="M20 11H7.8l5.6-5.6L12 4l-8 8 8 8 1.4-1.4L7.8 13H20z"/></svg></button><span></span></div>
 <div class="sinfo" id="sinfo"></div>

<div class="dim" id="dim"><div class="sheet" id="sheet"></div></div>
<div class="adm" id="adm"></div>
<div class="tlk" id="tlk"><div class="tb" id="tlkB">🔒<i></i></div><div class="hn" id="tlkH">🔒 화면이 잠겨 있어요</div></div>
<div class="tlock" id="tlock"></div>
<div class="toast" id="toast"></div>

<script>
const APPVER='20261106s';
const DB='https://matchmaker-28187-default-rtdb.asia-southeast1.firebasedatabase.app/';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const now=()=>Date.now();
const uid=()=>(now().toString(36)+Math.random().toString(36).slice(2,8)).slice(0,16);
const today=()=>{const d=new Date();return d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')};
let L={};try{L=JSON.parse(localStorage.getItem('kid_tv_v1')||'{}')}catch(e){}
const saveL=()=>{try{localStorage.setItem('kid_tv_v1',JSON.stringify(L))}catch(e){}};
const S={T:{},fam:'',pid:'',tab:'home',chip:'all',D:{cfg:{},ch:{},hide:{},like:{},hist:{},log:{}},V:{},shown:0,adminUntil:0};

/* ── 서버 ── */
async function get(p){const r=await fetch(DB+'kid_tv/'+S.fam+'/'+p+'.json',{cache:'no-store'});if(!r.ok)throw r.status;return r.json()}
function put(p,v){return fetch(DB+'kid_tv/'+S.fam+'/'+p+'.json',{method:v===null?'DELETE':'PUT',body:v===null?undefined:JSON.stringify(v)}).catch(()=>{})}
function ask(k,u){const id=uid().toLowerCase().replace(/[^a-z0-9]/g,'');fetch(DB+'kid_tv_q/'+S.fam+'/'+id+'.json',{method:'PUT',body:JSON.stringify({k,u:u||'',at:now()})});return id}
async function waitReq(id,ms=240000){const t0=now();while(now()-t0<ms){await new Promise(r=>setTimeout(r,2500));try{const r=await get('req/'+id);if(r){put('req/'+id,null);return r}}catch(e){}}return {st:'fail',msg:'맥이 응답이 없어요 (꺼져 있나요?)'}}

async function loadAll(){
  const [cfg,ch,hide]=await Promise.all([get('cfg'),get('ch'),get('hide')]);
  S.D.cfg=cfg||{};S.D.ch=ch||{};S.D.hide=hide||{};
  if(S.pid){const [like,hist,lg]=await Promise.all([get('like/'+S.pid),get('hist/'+S.pid),get('log/'+today())]);S.D.like=like||{};S.D.hist=hist||{};S.D.log=lg||{}}
  await Promise.all(Object.entries(S.D.ch).map(async([cid,c])=>{
    const ck='kid_tv_vid_'+cid;let x=null;try{x=JSON.parse(localStorage.getItem(ck)||'null')}catch(e){}
    if(!x||x.at!==c.up){try{x=await get('vid/'+cid);try{localStorage.setItem(ck,JSON.stringify(x))}catch(e){}}catch(e){}}
    S.V[cid]=x||{v:[],s:[]};try{S.T[cid]=await get('tp/'+cid)||null;localStorage.setItem('kid_tv_tp_'+cid,JSON.stringify(S.T[cid]))}catch(e){}}));
  for(const k of Object.keys(S.V))if(!S.D.ch[k])delete S.V[k];
  L.cache={cfg:S.D.cfg,ch:S.D.ch,hide:S.D.hide};saveL()}

/* ── 영상 목록 ── */
const chOn=()=>Object.entries(S.D.ch).filter(([k,c])=>c&&!c.off).sort((a,b)=>(a[1].at||0)-(b[1].at||0));
const onlyRe=c=>{if(!c||(!c.only&&!c.ex))return null;try{const a=c.only?new RegExp(c.only,'i'):null,b=c.ex?new RegExp(c.ex,'i'):null;return {test:t=>(!a||a.test(t))&&(!b||!b.test(t))}}catch(e){return null}};
function allVids(){const out=[];for(const [cid,c] of chOn()){if(S.lang&&c.lang&&c.lang!==S.lang)continue;const re=onlyRe(c);(S.V[cid]?.v||[]).forEach((x,i)=>{if(!S.D.hide[x[0]]&&(!re||re.test(x[1])))out.push({id:x[0],t:x[1],d:x[2],vw:x[3],c:cid,i})})}return out}
function allShorts(){if(S.D.cfg.noShorts)return [];const out=[];for(const [cid,c] of chOn()){if(c.noS)continue;(S.V[cid]?.s||[]).forEach((x,i)=>{if(!S.D.hide[x[0]])out.push({id:x[0],t:x[1],vw:x[2],c:cid,i,s:1})})}return out}
function findVid(id){for(const [cid] of Object.entries(S.D.ch)){const a=S.V[cid];if(!a)continue;let x=a.v.find(y=>y[0]===id);if(x)return{id,t:x[1],d:x[2],vw:x[3],c:cid};x=a.s.find(y=>y[0]===id);if(x)return{id,t:x[1],vw:x[2],c:cid,s:1}}
  for(const [cid] of Object.entries(S.D.ch)){for(const pl of S.V[cid]?.p||[]){const x=pl[2].find(y=>y[0]===id);if(x)return{id,t:x[1],d:x[2],c:cid}}}return null}
const plOf=(cid,pi)=>(S.V[cid]?.p||[])[pi];
/* 「S5 E16」처럼 편 번호가 붙은 목록은 1편부터 차례대로 */
const epNo=t=>{const m=/S\s*(\d+)\s*E\s*(\d+)/i.exec(t)||/시즌\s*(\d+)\D{0,6}(\d+)\s*(?:편|화)/.exec(t);return m?(+m[1])*1000+(+m[2]):null};
function plItems(pl){if(!pl)return [];const a=pl[2].filter(x=>!S.D.hide[x[0]]).map(x=>({id:x[0],t:x[1],d:x[2],ep:epNo(x[1])}));
  const n=a.filter(x=>x.ep!==null).length;if(n>=a.length*.6)a.sort((x,y)=>(x.ep??1e9)-(y.ep??1e9));return a}
const plRank=t=>/전체\s*에피소드|시즌|에피소드/.test(t)?0:1;
function seeded(arr,seed){let s=seed;const r=()=>(s=(s*1103515245+12345)&0x7fffffff)/0x7fffffff;const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
/* 학습 주제 (맥이 영상 제목·설명으로 나눈 것) — 채널이 여럿이면 이름이 같은 주제끼리 합침 */
function topics(){const out=[];for(const [cid,c] of chOn()){if(c.noTp)continue;const t=S.T[cid];if(!t||!t.topics)continue;for(const x of t.topics){if(!out.some(o=>o.n===x.n))out.push({n:x.n,e:x.e,k:x.k})}}
  const cnt=n=>allVids().filter(v=>inTopic(v,n)).length;return out.filter(o=>cnt(o.n)).sort((a,b)=>(a.k==='etc')-(b.k==='etc'))}
function inTopic(v,n){const t=S.T[v.c];if(!t||!t.m)return false;const ks=(t.m[v.id]||'').split(',');return t.topics.some(x=>x.n===n&&ks.includes(x.k))}
function chips4ch(chs){const out=[],seen={};for(const [k] of chs){const n=chN(k);const grp=chs.filter(([j])=>chN(j)===n).length>1;if(grp){if(!seen[n]){seen[n]=1;out.push(['g:'+n,n])}}else out.push(['c:'+k,n])}return out}
function homeList(){const all=allVids();if(S.chip.startsWith('g:')){const n=S.chip.slice(2);return all.filter(v=>chN(v.c)===n).sort((a,b)=>(b.vw||0)-(a.vw||0))}if(S.chip.startsWith('t:')){const n=S.chip.slice(2);const a=all.filter(v=>inTopic(v,n)).map(v=>({...v,ep:epNo(v.t)}));
    return [...a.filter(v=>v.ep!==null).sort((x,y)=>x.ep-y.ep),...a.filter(v=>v.ep===null).sort((x,y)=>x.i-y.i)]}if(S.chip==='new')return all.slice().sort((a,b)=>a.i-b.i);if(S.chip.startsWith('c:'))return all.filter(v=>v.c===S.chip.slice(2));
  const seed=+today()+(S.pid==='p2'?7:0)+(S.reseed||0);const fresh=all.filter(v=>v.i<12),rest=all.filter(v=>v.i>=12);return [...seeded(fresh,seed),...seeded(rest,seed+1)].sort((a,b)=>(S.D.hist[a.id]?1:0)-(S.D.hist[b.id]?1:0))}
const fmtD=s=>{s=Math.round(s||0);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+':'+String(m).padStart(2,'0'):m)+':'+String(x).padStart(2,'0')};
const fmtV=n=>!n?'':'조회수 '+(n>=1e8?(n/1e8).toFixed(1).replace('.0','')+'억':n>=1e4?(n/1e4).toFixed(n>=1e5?0:1).replace('.0','')+'만':n>=1e3?(n/1e3).toFixed(1).replace('.0','')+'천':n)+'회';
const avU=u=>u?u.replace(/=s\d+.*$/,'=s88-c-k-c0x00ffffff-no-rj'):'';
const chN=cid=>{if(S.D.ch[cid]?.nn)return S.D.ch[cid].nn;const n=S.D.ch[cid]?.n||'';return n.replace(/\s*-\s*(한국\s*-\s*)?공식\s*채널$/,'').trim()||n};
const thU=id=>`https://i.ytimg.com/vi/${id}/mqdefault.jpg`;
const sthU=id=>`https://i.ytimg.com/vi/${id}/oardefault.jpg`;
function vcard(v){return `<div class="vc" data-v="${v.id}"><div class="th"><img loading="lazy" src="${thU(v.id)}" alt="">${v.d?`<span class="dur">${fmtD(v.d)}</span>`:''}</div>
 <div class="meta"><img class="av" src="${esc(avU(S.D.ch[v.c]?.av))}" alt=""><div class="tx"><div class="ti">${esc(v.t)}</div><div class="sb">${esc(chN(v.c))}${v.vw?' · '+fmtV(v.vw):''}</div></div></div></div>`}
function scard(v){return `<div class="sc" data-s="${v.id}"><div class="st"><img loading="lazy" src="${sthU(v.id)}" onerror="this.onerror=null;this.src='https://i.ytimg.com/vi/${v.id}/hqdefault.jpg'" alt=""></div><div class="ti">${esc(v.t.replace(/\s*#shorts?/gi,''))}</div><div class="sb">${fmtV(v.vw)}</div></div>`}
const shortsIco='<svg viewBox="0 0 24 24"><path d="M15.4 2.6c1.7-.9 3.8-.3 4.7 1.4.9 1.7.3 3.8-1.4 4.7l-1.4.8c1.2.1 2.3.8 2.9 1.9.9 1.7.3 3.8-1.4 4.7l-8.2 4.3c-1.7.9-3.8.3-4.7-1.4-.9-1.7-.3-3.8 1.4-4.7l1.4-.8C7 13.4 5.9 12.7 5.3 11.6c-.9-1.7-.3-3.8 1.4-4.7z" fill="#ff0033"/><path d="M10 9.2v5.6l4.8-2.8z" fill="#fff"/></svg>';

/* ── 화면 ── */
function render(){
  const nt=['ch','pls','pl'].includes(S.tab)?(S.from||'home'):S.tab;$$('#nav button').forEach(b=>{b.style.fontWeight=b.dataset.t===nt?'700':'400';b.style.opacity=b.dataset.t===nt?1:.85});
  meBtn();bell();$('#nav [data-t="shorts"]').classList.toggle('hide',!!S.D.cfg.noShorts);
  const chs=chOn();$('#chips').classList.toggle('hide',S.tab!=='home');
  const hasPl=chs.some(([k,c])=>!c.only&&(S.V[k]?.p||[]).length);
  const langs=[...new Set(chs.map(([k,c])=>c.lang).filter(Boolean))];
  if(S.tab==='home')$('#chips').innerHTML=(langs.length>1?[['L:ko','🇰🇷 한국어'],['L:en','🇺🇸 영어']].map(([k,n])=>`<button class="chip ${S.lang===k.slice(2)?'on':''}" data-c="${k}" style="${S.lang===k.slice(2)?'background:#065fd4;color:#fff':''}">${n}</button>`).join('')+'<span style="flex:none;width:1px;background:var(--line);margin:4px 2px"></span>':'')+[['all','전체'],...topics().map(t=>['t:'+t.n,(t.e?t.e+' ':'')+t.n]),['new','최신'],...(hasPl?[['pls','📋 재생목록']]:[]),...chips4ch(chs)].map(([k,n])=>`<button class="chip ${S.chip===k?'on':''}" data-c="${esc(k)}">${esc(n)}</button>`).join('');
  const on=$$('#chips .chip.on').filter(e=>!e.dataset.c.startsWith('L:'))[0];if(on&&on.dataset.c!=='all')on.scrollIntoView({inline:'center',block:'nearest'});
  $$('#chips [data-c]').forEach(b=>b.onclick=()=>{const c=b.dataset.c;if(c.startsWith('L:')){const l=c.slice(2);S.lang=S.lang===l?'':l;L.lang=S.lang;saveL();S.shown=0;render();return}if(c==='pls'){go({tab:'pls'});return}if(c.startsWith('c:')){go({tab:'ch',cid:c.slice(2),ctab:'v'});return}S.chip=c;S.shown=0;render();scrollTo(0,0)});
  const m=$('#m');
  if(!chs.length){m.innerHTML='<div class="empty">아직 볼 수 있는 채널이 없어요.<br>오른쪽 위 동그라미 → ⚙️ 부모 설정에서 채널을 넣어 주세요.</div>';return}
  if(S.tab==='home'){S.list=homeList();S.shown=Math.max(S.shown,10);
    let h='<div class="feed">';const sh=allShorts();
    S.list.slice(0,S.shown).forEach((v,i)=>{h+=vcard(v);if(i===2&&sh.length&&S.chip!=='new'){h+=`</div><div class="sec">${shortsIco}Shorts</div><div class="shrow">${seeded(sh,+today()).slice(0,10).map(scard).join('')}</div><div class="feed">`}});
    h+='</div><div class="more" id="more"></div>';m.innerHTML=h}
  else if(S.tab==='subs'){let h='<div class="chips" style="padding-top:8px">'+chs.map(([k,c])=>`<button class="chip" data-ch="${esc(k)}" style="display:flex;align-items:center;gap:6px;background:none;flex-direction:column;font-size:12px"><img class="av" style="width:56px;height:56px" src="${esc(avU(c.av))}" alt="">${esc(chN(k))}</button>`).join('')+'</div>';
    const all=allVids().sort((a,b)=>a.i-b.i);S.list=all;S.shown=Math.max(S.shown,10);h+='<div class="feed">'+all.slice(0,S.shown).map(vcard).join('')+'</div><div class="more" id="more"></div>';m.innerHTML=h}
  else if(S.tab==='ch'){const c=S.D.ch[S.cid];if(!c){S.tab='home';return render()}const a=S.V[S.cid]||{v:[],p:[]};
    let h=backBar(chN(S.cid));if(c.ban)h+=`<div style="margin:0 12px;border-radius:12px;overflow:hidden;aspect-ratio:6/1;background:url('${esc(c.ban.replace(/=s0$/,'=w1060-fcrop64=1,00005a57ffffa5a8-k-c0xffffffff-no-nd-rj'))}') center/cover"></div>`;
    h+=`<div class="chrow" style="padding:14px 12px"><img class="av" style="width:72px;height:72px" src="${esc(avU(c.av))}" alt=""><div class="sp"><b style="font-size:20px;white-space:normal">${esc(c.n)}</b><span class="sb">${esc(c.h||'')} · 동영상 ${c.nv||0}개</span></div></div>`;
    h+=`<div class="chips" style="border-bottom:1px solid var(--line);padding-bottom:0;gap:0">${[['v','동영상'],['p','재생목록']].filter(([k])=>k!=='p'||(!c.only&&(a.p||[]).length)).map(([k,n])=>`<button class="ctab" data-ct="${k}" style="padding:10px 16px;font-weight:600;font-size:15px;border-bottom:2px solid ${S.ctab===k?'var(--fg)':'transparent'};color:${S.ctab===k?'var(--fg)':'var(--sub)'}">${n}</button>`).join('')}</div>`;
    if(S.ctab==='p'){h+=plGrid(S.cid)}
    else{S.sort=S.sort||'new';h+=`<div class="chips" style="padding-top:10px">${[['new','최신순'],['pop','인기순'],['old','오래된순']].map(([k,n])=>`<button class="chip ${S.sort===k?'on':''}" data-so="${k}">${n}</button>`).join('')}</div>`;
      let vs=allVids().filter(v=>v.c===S.cid);vs=S.sort==='pop'?vs.sort((x,y)=>(y.vw||0)-(x.vw||0)):S.sort==='old'?vs.sort((x,y)=>y.i-x.i):vs.sort((x,y)=>x.i-y.i);
      S.list=vs;S.shown=Math.max(S.shown,10);h+='<div class="feed">'+vs.slice(0,S.shown).map(vcard).join('')+'</div><div class="more" id="more"></div>'}
    m.innerHTML=h;$$('[data-ct]').forEach(b=>b.onclick=()=>go({ctab:b.dataset.ct},1));$$('[data-so]').forEach(b=>b.onclick=()=>{S.sort=b.dataset.so;S.shown=0;render()})}
  else if(S.tab==='pls'){let h=backBar('재생목록');for(const [k] of chs){if(!(S.V[k]?.p||[]).length)continue;if(chs.length>1)h+=`<div class="sec">${esc(chN(k))}</div>`;h+=plGrid(k)}m.innerHTML=h}
  else if(S.tab==='pl'){const pl=plOf(S.cid,S.pi);if(!pl){S.tab='home';return render()}const it=plItems(pl);
    let h=backBar('');h+=`<div style="margin:0 12px 14px;border-radius:14px;overflow:hidden;background:linear-gradient(#0000,#0009),url(${thU(it[0]?.id||'')}) center/cover;aspect-ratio:16/8;display:flex;flex-direction:column;justify-content:flex-end;padding:14px;color:#fff"><b style="font-size:20px;line-height:1.3">${esc(pl[1])}</b><span style="font-size:13px;opacity:.9;margin-top:4px">${esc(chN(S.cid))} · 동영상 ${it.length}개</span>
      <button class="sbtn" data-plp="0" style="background:#fff;color:#000;margin-top:10px;align-self:flex-start;padding:9px 20px">▶ 모두 재생</button></div>`;
    h+=it.map((v,i)=>`<div class="ri" data-plv="${i}"><span style="width:18px;flex:none;align-self:center;color:var(--sub);font-size:13px;text-align:center">${i+1}</span><div class="th" style="width:40%"><img loading="lazy" src="${thU(v.id)}" alt="">${v.d?`<span class="dur">${fmtD(v.d)}</span>`:''}</div><div class="tx"><div class="ti">${esc(v.t)}</div>${S.D.hist[v.id]?'<div class="sb">✔ 봤어요</div>':''}</div></div>`).join('');
    m.innerHTML=h;$$('[data-plv],[data-plp]').forEach(r=>r.onclick=()=>{const i=+(r.dataset.plv??r.dataset.plp);openWatch(it[i].id,{cid:S.cid,pi:S.pi})})}
  else if(S.tab==='lib'){const hs=Object.entries(S.D.hist).sort((a,b)=>b[1]-a[1]).map(([id])=>findVid(id)).filter(v=>v&&!S.D.hide[v.id]);
    const lk=Object.entries(S.D.like).sort((a,b)=>b[1]-a[1]).map(([id])=>findVid(id)).filter(v=>v&&!S.D.hide[v.id]);const p=prof();
    let h=`<div class="chrow" style="padding:16px 12px"><div class="pav" style="width:64px;height:64px;font-size:28px;background:${esc(p.c||'#888')}">${esc(ini(p))}</div><div class="sp"><b style="font-size:22px">${esc(p.n||'')}</b><span class="sb">${limTxt()}</span></div></div>`;
    h+=`<div class="sec">기록</div>`+(hs.length?`<div class="shrow">${hs.slice(0,20).map(v=>v.s?scard(v):`<div class="sc" style="width:46vw;max-width:220px" data-v="${v.id}"><div class="th" style="border-radius:10px"><img loading="lazy" src="${thU(v.id)}" alt="">${v.d?`<span class="dur">${fmtD(v.d)}</span>`:''}</div><div class="ti">${esc(v.t)}</div><div class="sb">${esc(chN(v.c))}</div></div>`).join('')}</div>`:'<div class="note" style="padding:0 12px 16px">아직 본 영상이 없어요</div>');
    h+=`<div class="sec">👍 좋아요 표시한 동영상</div>`+(lk.length?'<div class="feed">'+lk.map(v=>v.s?vcard({...v,d:0}):vcard(v)).join('')+'</div>':'<div class="note" style="padding:0 12px 16px">영상 화면에서 👍를 누르면 여기 모여요</div>');
    m.innerHTML=h}
  bindCards(m);
  const mo=$('#more');if(mo){new IntersectionObserver((es,o)=>{if(es[0].isIntersecting&&S.shown<S.list.length){o.disconnect();S.shown+=10;const y=scrollY;render();scrollTo(0,y)}},{rootMargin:'600px'}).observe(mo)}
  $$('[data-ch]').forEach(b=>b.onclick=()=>go({tab:'ch',cid:b.dataset.ch,ctab:'v'}));
  $$('[data-pl]').forEach(b=>b.onclick=()=>{const [c,i]=b.dataset.pl.split('|');go({tab:'pl',cid:c,pi:+i})});
  const bk=$('#backB');if(bk)bk.onclick=()=>history.back()}
/* 화면 이동: 뒤로 가기(안드로이드 버튼·스와이프)도 되게 */

function seekAt(x){const r=$('#seek').getBoundingClientRect();const f=Math.min(1,Math.max(0,(x-r.left)/r.width));const y=P.w.yt;if(y&&y.getDuration){const d=y.getDuration();y.seekTo(f*d,!seeking);paintSeek(f*d,d)}}
$('#seek').addEventListener('pointerdown',e=>{e.stopPropagation();seeking=true;$('#seek').setPointerCapture(e.pointerId);seekAt(e.clientX);showCtl()});
$('#seek').addEventListener('pointermove',e=>{if(seeking){seekAt(e.clientX);showCtl()}});
$('#seek').addEventListener('pointerup',e=>{seeking=false;seekAt(e.clientX)});
$('#bar').onclick=e=>e.stopPropagation();
function paintSeek(t,d){const f=d?t/d:0;$('#spl').style.width=f*100+'%';$('#skn').style.left=f*100+'%';$('#tm').textContent=fmtD(t)+' / '+fmtD(d)}

(()=>{let y0=null,t0=0;const sw=$('#swipe');

async function hash(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('kidtv:'+S.fam+':'+s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('').slice(0,32)}
/* 어른 프로필: 비밀번호 맞으면 진짜 유튜브로 */
function ytGate(d,p){const n=p.pl||8;let v='';const draw=msg=>{d.innerHTML=`<h2>${esc(p.n)} 비밀번호</h2><div class="pin"><div class="ds">${Array.from({length:n},(_,i)=>`<i class="${i<v.length?'f':''}"></i>`).join('')}</div><div class="msg">${msg||''}</div><div class="kp">${[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(k=>`<button data-k="${k}" ${k===''?'style="visibility:hidden"':''}>${k}</button>`).join('')}</div></div><button class="sbtn" id="ygX">돌아가기</button>`;
  d.querySelector('#ygX').onclick=()=>{d.remove();whoScreen()};

    if(await hash('yt:'+v)===p.pw){stopAll();location.href='https://m.youtube.com/'}else{v='';draw('비밀번호가 달라요')}})};draw()}
function pinGate(ok){if(now()<S.adminUntil)return ok();const setting=!S.D.cfg.pin;let first='',v='';
  const draw=(msg)=>{sheet(`<h3 style="text-align:center">${setting?(first?'한 번 더 눌러 주세요':'부모 비밀번호 정하기 (숫자 4개)'):'부모 비밀번호'}</h3><div class="pin"><div class="ds">${[0,1,2,3].map(i=>`<i class="${i<v.length?'f':''}"></i>`).join('')}</div><div class="msg">${msg||''}</div><div class="kp">${[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(k=>`<button data-k="${k}" ${k===''?'style="visibility:hidden"':''}>${k}</button>`).join('')}</div></div>`);
    $$('#sheet [data-k]').forEach(b=>b.onclick=async()=>{const k=b.dataset.k;if(k==='⌫'){v=v.slice(0,-1);return draw()}v+=k;if(v.length<4)return draw();
      if(setting){if(!first){first=v;v='';return draw()}if(first!==v){first='';v='';return draw('두 번이 달라요. 다시 정해 주세요')}const h=await hash(v);S.D.cfg.pin=h;put('cfg/pin',h);closeSheet();S.adminUntil=now()+10*60000;toast('비밀번호를 정했어요');return ok()}

async function setup(){document.body.insertAdjacentHTML('beforeend',`<div class="who" id="setup"><div class="logo" style="font-size:30px"><svg viewBox="0 0 30 21" style="width:52px;height:36px"><rect width="30" height="21" rx="6" fill="#ff0033"/><path d="M12 6v9l8-4.5z" fill="#fff"/></svg>우리튜브</div>
  <p class="note" style="text-align:center;max-width:320px;font-size:15px">부모님이 고른 채널 영상만 보는 우리 집 유튜브예요.<br>검색도, 엉뚱한 추천 영상도 없어요.</p><button class="sbtn p" id="stGo" style="font-size:16px;padding:12px 22px">시작하기</button></div>`);
  $('#stGo').onclick=async()=>{S.fam=Array.from(crypto.getRandomValues(new Uint8Array(12)),b=>'abcdefghijklmnopqrstuvwxyz0123456789'[b%36]).join('');L.fam=S.fam;saveL();history.replaceState(null,'',location.pathname+'#f='+S.fam);
    S.D.cfg={at:now(),prof:{p1:{n:'첫째',lim:60,c:'#ff7aa2',o:1},p2:{n:'둘째',lim:60,c:'#4dabf7',o:2}}};await put('cfg',S.D.cfg);ask('hello');$('#setup').remove();pinGate(openAdmin)}}
async function init(){const h=new URLSearchParams(location.hash.slice(1));const f=h.get('f');if(f&&/^[a-z0-9]{10,16}$/.test(f)){if(L.fam!==f){L={fam:f};saveL()}}
  S.fam=L.fam||'';if(!S.fam)return setup();if(!f)history.replaceState(null,'',location.pathname+'#f='+S.fam);
  if(L.cache){S.D.cfg=L.cache.cfg||{};S.D.ch=L.cache.ch||{};S.D.hide=L.cache.hide||{};for(const cid of Object.keys(S.D.ch)){try{S.V[cid]=JSON.parse(localStorage.getItem('kid_tv_vid_'+cid)||'null')||{v:[],s:[]};S.T[cid]=JSON.parse(localStorage.getItem('kid_tv_tp_'+cid)||'null')}catch(e){}}}
  S.pid=L.pid&&S.D.cfg.prof?.[L.pid]?L.pid:'';S.lang=L.lang||'';
  try{await loadAll()}catch(e){if(!L.cache)return toast('인터넷 연결을 확인해 주세요')}
  S.pid=L.pid&&S.D.cfg.prof?.[L.pid]?L.pid:'';
  if(!S.pid)return whoScreen();
  if(!S.D.hist||!Object.keys(S.D.hist).length)try{await loadAll()}catch(e){}
  markSeen();render();checkLimit()}
document.addEventListener('visibilitychange',async()=>{if(!document.hidden&&S.fam){checkVer(true);if(S.D.log._d!==today()){S.D.log={_d:today()}}try{await loadAll();if(!$('#watch').classList.contains('on')&&!$('#shorts').classList.contains('on')&&!$('#adm').classList.contains('on'))render();checkLimit()}catch(e){}}else if(document.hidden&&S.pid&&S.D.log[S.pid])put('log/'+today()+'/'+S.pid,Math.round(S.D.log[S.pid]))});
let verBusy=false;async function checkVer(auto){if(verBusy)return;verBusy=true;try{const r=await fetch(location.pathname+'?vc='+now(),{cache:'no-store'});const t=await r.text();const m=t.match(/const APPVER='([^']+)'/);
  if(m&&m[1]!==APPVER){if(auto&&($('#watch').classList.contains('on')||$('#shorts').classList.contains('on')||$('#adm').classList.contains('on')))return;location.reload()}}catch(e){}finally{verBusy=false}}
setInterval(()=>{if(!document.hidden)checkVer(true)},300000);
init();
</script>
</body></html>
